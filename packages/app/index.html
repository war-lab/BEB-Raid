<!doctype html>
<html lang="ja" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 既定はダーク（J-8）。テーマ切替時は JS 側で content を更新する -->
    <meta name="theme-color" content="#0E1220" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- T-116(2): favicon 404の解消。既存のアプリアイコン資産をfaviconとして配線する -->
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <title>BEB Raid</title>
    <!-- OGP（docs/20 V-8）。og:imageは絶対URL必須のためGitHub PagesのURLを直書きする
         （配信先が変わったらここも直す）。画像はJPEG=LINE等のWebP非対応クローラー互換 -->
    <meta property="og:title" content="BEB Raid" />
    <meta property="og:description" content="通勤電車で英語ボスを討伐する TOEIC 学習アプリ" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://war-lab.github.io/BEB-Raid/" />
    <meta property="og:image" content="https://war-lab.github.io/BEB-Raid/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- J-39: 静的スプラッシュ。React マウントで#root の中身ごと自然に置換される -->
    <div id="root">
      <div
        id="boot-splash"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          font-family:
            system-ui,
            -apple-system,
            'Hiragino Sans',
            'Noto Sans JP',
            'Yu Gothic UI',
            sans-serif;
        "
      >
        <p style="margin: 0; font-size: 22px; font-weight: 700">BEB Raid</p>
        <div
          id="boot-spinner"
          style="
            width: 32px;
            height: 32px;
            border-width: 3px;
            border-style: solid;
            border-radius: 50%;
            animation: boot-spin 0.8s linear infinite;
          "
        ></div>
      </div>
    </div>
    <style>
      /* スプラッシュ（docs/20 V-8）: キービジュアル（夜行列車の車窓）を背景に敷く。
         ヒーローカードと同じく両テーマで夜の絵を維持する意匠判断（docs/20 3.1節の--hero-skyと同判断）
         のため、レビューF8(f)のライト側配色分岐は廃止し常時ダーク配色とする（意図したブランド表示
         であり「CSS読込前のダーク一瞬光り」問題とは別物）。画像読込前・失敗時は夜紺の地が出る。
         %BASE_URL%はViteがビルド時にbase（GitHub Pagesではサブパス）へ置換する */
      #boot-splash {
        background: #0e1220 url('%BASE_URL%splash.webp') center / cover no-repeat;
        color: #eaedf6;
      }
      #boot-spinner {
        border-color: #2c3552;
        border-top-color: #f5b83d;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
