<!doctype html>
<html lang="ja" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 既定はダーク（J-8）。テーマ切替時は JS 側で content を更新する -->
    <meta name="theme-color" content="#0E1220" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>BEB Raid</title>
  </head>
  <body>
    <!-- J-39: 静的スプラッシュ。React マウントで#root の中身ごと自然に置換される -->
    <div id="root">
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #0e1220;
          color: #eaedf6;
          font-family:
            system-ui,
            -apple-system,
            'Hiragino Sans',
            'Noto Sans JP',
            'Yu Gothic UI',
            sans-serif;
        "
      >
        <p style="margin: 0; font-size: 22px; font-weight: 700">BEB Raid</p>
        <div
          style="
            width: 32px;
            height: 32px;
            border: 3px solid #2c3552;
            border-top-color: #f5b83d;
            border-radius: 50%;
            animation: boot-spin 0.8s linear infinite;
          "
        ></div>
      </div>
    </div>
    <style>
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
