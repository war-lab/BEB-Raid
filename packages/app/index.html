<!doctype html>
<html lang="ja" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 既定はダーク（J-8）。テーマ切替時は JS 側で content を更新する -->
    <meta name="theme-color" content="#0E1220" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- T-116(2): favicon 404の解消。既存のアプリアイコン資産をfaviconとして配線する -->
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <title>BEB Raid</title>
  </head>
  <body>
    <!-- J-39: 静的スプラッシュ。React マウントで#root の中身ごと自然に置換される -->
    <div id="root">
      <div
        id="boot-splash"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          font-family:
            system-ui,
            -apple-system,
            'Hiragino Sans',
            'Noto Sans JP',
            'Yu Gothic UI',
            sans-serif;
        "
      >
        <p style="margin: 0; font-size: 22px; font-weight: 700">BEB Raid</p>
        <div
          id="boot-spinner"
          style="
            width: 32px;
            height: 32px;
            border-width: 3px;
            border-style: solid;
            border-radius: 50%;
            animation: boot-spin 0.8s linear infinite;
          "
        ></div>
      </div>
    </div>
    <style>
      /* スプラッシュ配色（レビューF8(f)）。既定はダーク（J-8）だが、OSがライト設定の
         端末でCSS読込前の一瞬ダークが光らないよう、prefers-color-scheme: light では
         tokens.css のライト側 --bg/--ink/--line/--gold 相当値を併記する
         （tokens.css読込前のため変数は使えず、値を複製している） */
      #boot-splash {
        background: #0e1220;
        color: #eaedf6;
      }
      #boot-spinner {
        border-color: #2c3552;
        border-top-color: #f5b83d;
      }
      @media (prefers-color-scheme: light) {
        #boot-splash {
          background: #f6f5f1;
          color: #211e18;
        }
        #boot-spinner {
          border-color: #ddd9ce;
          border-top-color: #996600;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
