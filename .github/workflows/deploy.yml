# GitHub Pages デプロイ（T-33。正本: docs/05_アーキテクチャ設計.md 1節・6節、docs/10 T-33行）
#
# main への push で、appビルド＋content/（パックJSON・音声mp3・manifest.json）を
# GitHub Pages に配信する。content/の合流（packs/audio/manifest.jsonをdistへコピー）は
# packages/app/scripts/copy-content.mjs が npm run build の一部として行う（T-37でローカル
# 開発でも同じ内容を見られるようにした際、合流ロジックの二重管理を避けるためこちらに
# 一本化した。以前あったこのワークフロー内のshell cp手順は撤去済み）。
# LLM/TTSキーはこのワークフローでは一切使わない（generate/ttsコマンドはビルド時のCLI
# 作業であり、Pagesデプロイ自体にはAPIキーが不要。将来キーを使う工程を足す場合も
# Actions Secrets のみを参照し、ワークフローファイルにキーを直書きしないこと）。
#
# VITE_RAID_API_BASE_URL（M3・H-1）: 共有API（Cloudflare Workers production環境）のURL。
# 非秘匿情報（公開エンドポイント）のため Secrets ではなく Repository variables
# （Settings → Secrets and variables → Actions → Variables）の RAID_API_BASE_URL を参照する。
# 未設定なら空文字になりRaidApi.isConfigured()=falseでレイド機能は無効のまま（縮退設計）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイの競合を避ける（前回のデプロイ中に新しいpushが来たら前回を打ち切って最新を優先）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 依存インストール
        run: npm ci
      - name: ビルド（shared-schema→cli→app。content/の合流はcontentAssetsPluginが行う）
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_RAID_API_BASE_URL: ${{ vars.RAID_API_BASE_URL }}
      # T-234（docs/29 Q-74・Q-83）: content/packs/*.json・manifest.json はリポジトリに
      # 直接コミットされる配信物で、上のビルドでは再検証されない。CI（ci.yml）だけで
      # 検証してもこのワークフローを迂回した配信は止められないため、配置直前にここでも
      # 検証する（validatePack・manifestのhash/sizeBytes一致・音声の参照切れ/孤児・
      # drafts乖離）。失敗時は以降のupload-pages-artifact/deployを実行しない
      - name: コンテンツ検証（配信物の再検証。T-234）
        run: node packages/cli/dist/index.js verify-content content
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
