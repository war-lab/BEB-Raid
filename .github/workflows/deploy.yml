# GitHub Pages デプロイ（T-33。正本: docs/05_アーキテクチャ設計.md 1節・6節、docs/10 T-33行）
#
# main への push で、appビルド＋content/（パックJSON・音声mp3・manifest.json）を
# GitHub Pages に配信する。content/の合流（packs/audio/manifest.jsonをdistへコピー）は
# packages/app/scripts/copy-content.mjs が npm run build の一部として行う（T-37でローカル
# 開発でも同じ内容を見られるようにした際、合流ロジックの二重管理を避けるためこちらに
# 一本化した。以前あったこのワークフロー内のshell cp手順は撤去済み）。
# LLM/TTSキーはこのワークフローでは一切使わない（generate/ttsコマンドはビルド時のCLI
# 作業であり、Pagesデプロイ自体にはAPIキーが不要。将来キーを使う工程を足す場合も
# Actions Secrets のみを参照し、ワークフローファイルにキーを直書きしないこと）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイの競合を避ける（前回のデプロイ中に新しいpushが来たら前回を打ち切って最新を優先）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 依存インストール
        run: npm ci
      - name: ビルド（shared-schema→cli→app。content/の合流はcontentAssetsPluginが行う）
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
