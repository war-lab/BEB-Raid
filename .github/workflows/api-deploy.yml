# 共有API（Cloudflare Workers）デプロイ（T-93。正本: docs/17_M3実装計画.md 3.10節・T-93シート）
#
# トリガー:
#   - main への push で dev と production の両方へ自動デプロイする（承認ゲートは置かない）
#   - workflow_dispatch（手動実行）で環境を選択（従来どおり）
#
# 【2026-07-30変更】以前は「production は手動dispatchのみ」だった（誤った本番自動デプロイを
# 避ける意図）。しかしGitHub Pagesは main への push で自動配信されるため、APIだけが取り残され、
# 本番APIがM3世代のまま公開アプリがM4のUIを持つ不整合が実際に発生した（イベントバトルの
# ルーム作成が404 not_found。docs/STATUS.md 2026-07-30の節）。**mainは常に本番と同じ内容である**
# を不変条件とし、APIもPagesと同じく main への push で本番へ出す設計へ変えた。
# 誤った本番反映の防止は main への直pushではなくPRレビューが担う。
# 正本は docs/17_M3実装計画.md 3.10節。
#
# `environment:` は Environment 保護のためではなく、GitHubのEnvironmentsタブに
# 環境別のデプロイ履歴を残すために付けている（保護ルールは意図的に設定していない）。
#
# 【前提=人間タスク H-1（✅完了・2026-07-22）】このワークフローは以下を GitHub Secrets に要求する:
# CLOUDFLARE_API_TOKEN（権限=「Edit Cloudflare Workers」）・CLOUDFLARE_ACCOUNT_ID。
# packages/api/wrangler.toml の KV namespace id も実IDへ差し替え済み。
# H-1完了済みのため現在はCLOUDFLARE_API_TOKENが設定されており、デプロイstepは常に実行される。
# 下の guard step は「シークレットが何らかの理由で失われた場合にワークフローを赤くせず
# 通知のみで済ませる」ための保険として残している（2026-08-07訂正・T-365・K-99）。
# シークレット値はこのファイルに一切書かない（publicリポジトリのため。docs/17 3.11節）。
name: Deploy API (Cloudflare Workers)

on:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
      # api は shared-schema の型・バリデータ・API契約型に依存するため、shared-schema だけが
      # 変わった push でもデプロイが必要（含めないと契約変更が本番に反映されず取り残される）
      - 'packages/shared-schema/**'
      # このワークフロー自体の変更（デプロイ方針の変更）もデプロイ経路の検証対象にする
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ先環境'
        type: choice
        options:
          - dev
          - production
        default: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # push（main）時は dev と production の両方を走らせる。workflow_dispatch 時は選択環境のみ。
      # fail-fast: false は片方の失敗でもう片方を打ち切らないため（dev だけ失敗しても本番の
      # デプロイは進めたい／逆に本番が失敗しても dev の状態は確定させたい）
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.environment) || '["dev","production"]') }}
    # Environmentsタブに環境別のデプロイ履歴を残す（保護ルールは設定していない。冒頭コメント参照）
    environment: ${{ matrix.environment }}
    # 連続pushで古いコミットのデプロイが後着して本番を巻き戻すのを防ぐ
    # （古い実行を打ち切り、常に最新コミットの内容が本番に残るようにする）
    concurrency:
      group: api-deploy-${{ matrix.environment }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 依存インストール
        run: npm ci
      # デプロイ前ゲート: wrangler の esbuild バンドルは型検査をしないため、
      # tsc --noEmit（api の build）とユニット/DOテストを事前に通す。
      # api は shared-schema の型に依存するため先に shared-schema をビルドする。
      - name: 型検査・テスト（デプロイ前ゲート）
        run: |
          npm run build -w @beb-raid/shared-schema
          npm run build -w @beb-raid/api
          npm test -w @beb-raid/api
      # H-1（Cloudflare準備）未了だと CLOUDFLARE_API_TOKEN が未設定になる。その場合は
      # デプロイstepをスキップし、ワークフロー自体は成功（緑）で終える。secretは step-level
      # の if から直接参照できないため、一旦 env に受けてから run で有無を判定し output に出す。
      - name: Cloudflareシークレット有無の確認
        id: guard
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN が未設定のためデプロイをスキップしました（H-1未了）。"
          fi
      - name: デプロイ
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/api
          wranglerVersion: '4'
          command: deploy --env ${{ matrix.environment }}
